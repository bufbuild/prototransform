version: "2"
linters:
  default: all
  disable:
    - cyclop          # covered by gocyclo
    - depguard        # requires custom config in newer versions to use non-stdlib deps
    - exhaustruct     # super-spammy and doesn't like idiomatic Go (especially w/ protos)
    - funlen          # rely on code review to limit function length
    - gocognit        # dubious "cognitive overhead" quantification
    - gomodguard      # deprecated in golangci v2.12.0
    - inamedparam     # convention is not followed
    - ireturn         # "accept interfaces, return structs" isn't ironclad
    - lll             # don't want hard limits for line length
    - maintidx        # covered by gocyclo
    - mnd             # some unnamed constants are okay
    - nlreturn        # generous whitespace violates house style
    - noinlineerr     # inline errors can be very useful to limit var scopes
    - nonamedreturns  # no bare returns is really what we care about
    - testpackage     # internal tests are fine
    - wrapcheck       # don't _always_ need to wrap errors
    - wsl             # generous whitespace violates house style
    - wsl_v5          # same as above
  settings:
    errcheck:
      check-type-assertions: true
    forbidigo:
      forbid:
        - pattern: ^fmt\.Print
        - pattern: ^log\.
        - pattern: ^print$
        - pattern: ^println$
        - pattern: ^panic$
    godox:
      # TODO, OPT, etc. comments are fine to commit. Use FIXME comments for
      # temporary hacks, and use godox to prevent committing them.
      keywords:
        - FIXME
    varnamelen:
      ignore-decls:
        - T any
        - i int
        - wg sync.WaitGroup
        - ok bool
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - path: (.+)\.go$
        # Don't ban use of fmt.Errorf to create new errors, but the remaining
        # checks from err113 are useful.
        text: do not define dynamic errors.*
      - linters:
          - gochecknoglobals
          - gocritic
        path: example_test\.go
      - linters:
          # We sometimes use the same test string in multiple places, but that
          # doesn't mean a constant is actually useful or needed.
          - goconst
        path: (.*)_test\.go$
formatters:
  enable:
    - gci
    - gofmt
  exclusions:
    generated: lax
